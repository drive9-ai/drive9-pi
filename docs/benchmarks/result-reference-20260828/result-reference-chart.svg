<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Drive9 Pi tool result reference evaluation</title>
  <desc id="desc">Measured raw tool result sizes compared with the fixed model-visible Drive9 reference size.</desc>
  <defs>
    <linearGradient id="raw" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#E65B4A"/>
      <stop offset="100%" stop-color="#F3A23A"/>
    </linearGradient>
    <linearGradient id="ref" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect x="46" y="38" width="1108" height="599" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="80" y="102" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0F172A">
    Tool results become references, not prompt ballast
  </text>
  <text x="80" y="138" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">
    Measured with real @drive9/drive9-pi fallback + result_read / result_search
  </text>

  <g transform="translate(80 185)">
    <rect x="0" y="0" width="1040" height="362" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="43" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">
      Context footprint after a tool call
    </text>
    <text x="806" y="43" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">
      Bar length uses log scale
    </text>

    <g transform="translate(26 78)">
      <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">73 KB output</text>
      <rect x="168" y="2" width="220" height="24" rx="6" fill="url(#raw)"/>
      <text x="404" y="20" font-family="Inter, Arial, sans-serif" font-size="14" fill="#7F1D1D">raw inline 73,695 B</text>
      <rect x="168" y="42" width="64" height="24" rx="6" fill="url(#ref)"/>
      <text x="248" y="60" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0F766E">Drive9 reference 2,048 B</text>
      <text x="800" y="42" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#0F172A">97.2%</text>
      <text x="802" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">less model-visible text</text>
    </g>

    <g transform="translate(26 174)">
      <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">1.47 MB output</text>
      <rect x="168" y="2" width="430" height="24" rx="6" fill="url(#raw)"/>
      <text x="614" y="20" font-family="Inter, Arial, sans-serif" font-size="14" fill="#7F1D1D">raw inline 1,470,195 B</text>
      <rect x="168" y="42" width="64" height="24" rx="6" fill="url(#ref)"/>
      <text x="248" y="60" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0F766E">Drive9 reference 2,048 B</text>
      <text x="800" y="42" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#0F172A">99.86%</text>
      <text x="802" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">less model-visible text</text>
    </g>

    <g transform="translate(26 270)">
      <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">7.35 MB output</text>
      <rect x="168" y="2" width="570" height="24" rx="6" fill="url(#raw)"/>
      <text x="500" y="-8" font-family="Inter, Arial, sans-serif" font-size="14" fill="#7F1D1D">raw inline 7,350,195 B</text>
      <rect x="168" y="42" width="64" height="24" rx="6" fill="url(#ref)"/>
      <text x="248" y="60" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0F766E">Drive9 reference 2,048 B</text>
      <text x="800" y="42" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#0F172A">99.97%</text>
      <text x="802" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">less model-visible text</text>
    </g>
  </g>

  <g transform="translate(80 578)">
    <rect x="0" y="-28" width="20" height="12" rx="3" fill="url(#raw)"/>
    <text x="30" y="-18" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Raw tool result if inserted into context</text>
    <rect x="312" y="-28" width="20" height="12" rx="3" fill="url(#ref)"/>
    <text x="342" y="-18" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Drive9 durable result reference</text>
    <text x="0" y="22" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
      Hidden facts stayed out of context, then came back via bounded search/read in ~3-6 KB.
    </text>
    <text x="0" y="50" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">
      Strong fit: logs, build output, test output, grep results, diagnostics. Not a replacement for full-document reasoning without retrieval.
    </text>
  </g>
</svg>
