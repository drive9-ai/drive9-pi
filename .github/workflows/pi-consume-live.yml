name: Pi consume live gate

on:
  pull_request:
    paths:
      - ".github/workflows/pi-consume-live.yml"
      - "e2e/pi-consume-crash-consumer.mjs"
      - "e2e/pi-consume-crash.ts"
      - "package-lock.json"
      - "package.json"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consume-chain:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'dat9-dev2/pi-consume-crash-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRIVE9_E2E_REQUIRED: "1"
      DRIVE9_SERVER: ${{ secrets.TASK270_DRIVE9_SERVER }}
      DRIVE9_API_KEY: ${{ secrets.TASK270_DRIVE9_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required clean-package consume-chain gate
        run: npm run e2e:pi-consume-crash
